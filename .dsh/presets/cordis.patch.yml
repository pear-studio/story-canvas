# 两个预设由此 bundle 声明；通过 DSH Plugin Manager 安装。
- insert:
    - id: preset-story-canvas
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story-canvas
        name: StoryCanvas 创作
        description: 完整创作、生成、材料整理与运行维护。
        order: 10
        plugins:
          # `story-canvas` agent preset：面向 StoryCanvas 工作台的创作会话。
          #
          # 能力集介于 standard 与 minimal 之间：保留文件、命令行、搜索、后台任务、
          # 技能与上下文压缩等基础能力；去掉运行时自修改（cordis）、子代理/工作流编排、
          # 计划模式和自主目标——创作流程由用户把控节奏，agent 完成当前明确的一步。
          #
          # 工作台操作通过统一 story_canvas 工具与仓库 CLI
          # 完成；领域契约见仓库 docs/reference/agent-interfaces.md，项目规则见 AGENTS.md。

          # 创作人格。{{model}} 与 {{cwd}} 由会话自身路由与工作区解析。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                你是 StoryCanvas 创作助手，由 {{model}} 驱动。用中文简洁沟通，只完成当前委托；大纲讨论、材料整理和分页规划不自动进入生成或训练。
                项目查询与编辑用 story_canvas：help 查分类，target 查分类或操作用法；不知道操作名就查所属分类，不能转去搜文件。项目设置查 project 分类，正文查 facts 分类。先索引、后目标，只读相关上下文。创作规则遵循 AGENTS.md，按需加载技能。
                文件工具用于资料与临时草稿，Shell 用于下载和环境维护；只有分类帮助确认未覆盖的项目操作才考虑 CLI，不扫描历史或源码找捷径，不直接写项目事实。编辑前读草稿或 prompt.context，保留指纹；冲突重读判断，连续失败说明缺口，请求补充工具或交给其他 Agent。
                按回执简短报告结果、待确认事项和必要入口，不罗列操作过程。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # 工作台 CLI 经 shell 调用；注册表与沙箱在 host 平面。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # 草稿读写与仓库检索；注册进 host tools 注册表，不提供服务，无需 realm。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────────

          # 生成等待、dev server 等长命令的后台化；任务注册表在 host 平面。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── compaction ──────────────────────────────────────────────────────────────

          # 长会话上下文压缩；tokenMeter 留在 host 平面。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 素材搜寻与资料核查需要联网；web 服务与搜索 provider 在 host 平面。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # 项目技能（.agents/skills/）由部署全局注册合并进目录，本 preset 不带自有技能。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── StoryCanvas ─────────────────────────────────────────────────────────────

          # 工作台薄工具。注册进 host tools 注册表、不提供服务，无需 realm。模块在本文件
          # 旁边，相对 import 仓库共用客户端（app/scripts/workbench-client.mjs），不复制
          # HTTP 行为。模块插件必须具名导出 inject = ['tools'] 才能访问 ctx.tools。
          # 失败以包含完整 JSON 诊断的异常文本返回，保持 DSH 工具失败状态。
          - id: tool-story-canvas
            name: '@local/dsh-story-canvas-presets/tools'
    - id: preset-story-canvas-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story-canvas-lite
        name: StoryCanvas 极简
        description: 本地模型用；大纲、Prompt、页面管理、文件查找与读图。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你是 StoryCanvas 创作助手，用中文简洁沟通，只完成用户当前明确的任务。工具仓库：{{story_canvas_root}}；工作区：{{cwd}}。
                创作：画面优先，故事易懂连贯，不擅自扩写。分页草案确认后再写入；用户原文原样保留。画面简短白描，通常不超过20字；Prompt 每条动作或关系最多20个英文词，不拆条绕过。新增子设定先讨论验证，LoRA 变更须用户同意。
                定位：用工作台查询项目，用骨架和索引取得目标 ID。未知文件路径先用 glob 在相关目录查找，再 read 或 read_image；不要猜路径或扫描整个仓库。
                操作：统一用 story_canvas。help 看分类，target:分类ID 看操作，target:操作名 看参数，再用 operation 与 args 执行；status 查看版本和限制。disabled 操作请用户交给其他 Agent，不猜接口或翻源码绕路。浏览用分页列表，编辑才读草稿或 prompt.context；不批量读取完整 Prompt。保留读取时的指纹、revision 或 etag；冲突重读判断，连续失败停止，不盲目重放。
                未覆盖规则按需查 AGENTS.md 或对应技能。一般讨论无需工具，不反复读取未变内容。
                能力：通过工作台编辑项目、材料、训练数据和设置，可读取文件图片；不能写任意文件、执行 Shell 或联网。模型生成与训练执行被限制插件禁用，其他能力以 help 为准。缺少必要或方便的工具时说明缺口并请求用户提供，或交给其他 Agent；不反复绕路。依据工具回执报告完成情况。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readLimit: 100
              readMaxBytes: 12000
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              globMaxResults: 40
          - id: tool-story-canvas
            name: '@local/dsh-story-canvas-presets/tools'
          - id: lite-tools
            name: '@local/dsh-story-canvas-presets/lite-tools'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.75
                  headroomTokens: 4096
                  retainTokens: 4096
                  maxTokens: 2048
                  modelPolicies:
                    - provider: ollama-local
                      model: huihui-qwen3.8:27b-ud-q4
                      summarizationProvider: deepseek-official
                      summarizationModel: deepseek-flash
                      maxTokens: 4096
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
