# 两个预设由此 bundle 声明；通过 DSH Plugin Manager 安装。
- insert:
    - id: preset-story-canvas
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story-canvas
        name: StoryCanvas 创作
        description: 完整创作、生成、材料整理与运行维护。
        order: 10
        plugins:
          # `story-canvas` agent preset：面向 StoryCanvas 工作台的创作会话。
          #
          # 能力集介于 standard 与 minimal 之间：保留文件、命令行、搜索、后台任务、
          # 技能与上下文压缩等基础能力；去掉运行时自修改（cordis）、子代理/工作流编排、
          # 计划模式和自主目标——创作流程由用户把控节奏，agent 完成当前明确的一步。
          #
          # 工作台操作通过底部两个薄工具（story_canvas_api / story_canvas_facts）与仓库 CLI
          # 完成；领域契约见仓库 docs/reference/agent-interfaces.md，项目规则见 AGENTS.md。

          # 创作人格。{{model}} 与 {{cwd}} 由会话自身路由与工作区解析。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                你是 StoryCanvas 创作助手，由 {{model}} 驱动，运行在 DeepSeek Harness 上。

                StoryCanvas 是本地视觉创作工作台。你通过工作台的 HTTP 接口与 CLI 完成剧情分页、
                画面生成、LoRA 训练、材料整理与相关数据收集分析；用户通过浏览器查看与验收。
                操作契约以仓库 docs/reference/agent-interfaces.md 为准，项目规则以 AGENTS.md 为准。

                你只完成用户当前明确的一步，不默认长期运转或自动铺开后续单元。事实编辑先读
                完整上下文、保留指纹、只改正文；LoRA 改动、生成数量等按项目规则的授权范围执行。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # 工作台 CLI 经 shell 调用；注册表与沙箱在 host 平面。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # 草稿读写与仓库检索；注册进 host tools 注册表，不提供服务，无需 realm。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────────

          # 生成等待、dev server 等长命令的后台化；任务注册表在 host 平面。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── compaction ──────────────────────────────────────────────────────────────

          # 长会话上下文压缩；tokenMeter 留在 host 平面。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  modelPolicies:
                    - provider: ollama-local
                      model: huihui-qwen3.8:27b-ud-q4
                      headroomTokens: 4096
                      maxTokens: 2048

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 素材搜寻与资料核查需要联网；web 服务与搜索 provider 在 host 平面。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # 项目技能（.agents/skills/）由部署全局注册合并进目录，本 preset 不带自有技能。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── StoryCanvas ─────────────────────────────────────────────────────────────

          # 工作台薄工具。注册进 host tools 注册表、不提供服务，无需 realm。模块在本文件
          # 旁边，相对 import 仓库共用客户端（app/scripts/workbench-client.mjs），不复制
          # HTTP 行为。模块插件必须具名导出 inject = ['tools'] 才能访问 ctx.tools。
          # 失败以包含完整 JSON 诊断的异常文本返回，保持 DSH 工具失败状态。
          - id: tool-story-canvas
            name: '@local/dsh-story-canvas-presets/tools'
    - id: preset-story-canvas-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story-canvas-lite
        name: StoryCanvas 极简
        description: 本地模型用；大纲、Prompt、页面管理、文件查找与读图。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你是 StoryCanvas 创作助手，用中文简洁沟通，只完成用户当前明确的任务。工具仓库：{{story_canvas_root}}；工作区：{{cwd}}。
                创作：画面优先，故事易懂连贯，不擅自扩写。分页草案确认后再写入；用户原文原样保留。画面简短白描，通常不超过20字；Prompt 每条动作或关系最多20个英文词，不拆条绕过。新增子设定先讨论验证，LoRA 变更须用户同意。
                定位：用 story_canvas_api GET /api/projects 查项目，用骨架和索引取得目标 ID。不知道文件路径时用 glob 在相关目录查找，再 read 或 read_image；不要猜路径或扫描整个仓库。接口不明确时先 read 仓库 .dsh/presets/QUICKSTART.md，必要时查其引用文档。
                编辑：项目事实只通过工作台工具写入。用 story_canvas_facts 的 read 取得草稿，只修改 document；save 时提交完整草稿，保留 project_id、target_id 和两个 expected 指纹，不能只传改动字段。创建、复制、删除页面走 story_canvas_api 的对应语义接口；按接口要求读取并携带最新 revision，不能只改索引代替这些操作。
                Prompt：先调用 prompt-context，检查当前模型、上游引用、覆盖和参考图；只改返回的 draft.document，按返回的 save.domain/kind 提交完整 draft，不回写只读 context 或覆盖无关模型数据。发生冲突先重读、判断差异，不换指纹强行提交；保存结果和诊断分别报告，不盲目重放请求。
                未覆盖规则按需查 AGENTS.md 或对应技能；本预设按用户要求将动作/关系词数上限设为20，覆盖原15词要求。一般讨论无需工具，不反复读取未变内容。
                能力：可查找、读取文件和图片，通过工作台编辑项目；不能写任意文件、执行 Shell 或联网。生成、训练、环境维护和开发请用户交给其他 Agent。缺少必要或方便的工具时，说明具体缺口并请求用户提供，或交给其他 Agent；不要反复尝试低效绕路。依据工具回执报告完成情况。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readLimit: 100
              readMaxBytes: 12000
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              globMaxResults: 40
          - id: tool-story-canvas
            name: '@local/dsh-story-canvas-presets/tools'
          - id: lite-tools
            name: '@local/dsh-story-canvas-presets/lite-tools'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.75
                  headroomTokens: 4096
                  retainTokens: 4096
                  maxTokens: 2048
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
