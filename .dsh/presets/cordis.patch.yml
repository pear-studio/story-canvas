# 两个预设由此 bundle 声明；通过 DSH Plugin Manager 安装。
- insert:
    - id: preset-story-canvas
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story-canvas
        name: StoryCanvas 创作
        description: 完整创作、生成、材料整理与运行维护。
        order: 10
        plugins:
          # `story-canvas` agent preset：面向 StoryCanvas 工作台的创作会话。
          #
          # 能力集介于 standard 与 minimal 之间：保留文件、命令行、搜索、后台任务、
          # 技能与上下文压缩等基础能力；去掉运行时自修改（cordis）、子代理/工作流编排、
          # 计划模式和自主目标——创作流程由用户把控节奏，agent 完成当前明确的一步。
          #
          # 工作台操作通过统一 story_canvas 工具与仓库 CLI
          # 完成；操作契约由工具 help 提供，规则入口见工具仓库 AGENTS.md。

          # 创作人格。{{model}} 与 {{cwd}} 由会话自身路由与工作区解析。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 工具仓库：{{story_canvas_root}}；当前工作区：{{cwd}}。
              prefix: |-
                你是 StoryCanvas 创作助手，由 {{model}} 驱动，用中文简洁沟通。先读工具仓库 AGENTS.md，按任务加载专项技能及其规则；技能目录缺项时读取该仓库 .agents/skills/<名称>/SKILL.md。
                工作台任务优先用 story_canvas；未知操作或字段查工具 help，不猜接口、不搜索旧脚本绕路。文件与 Shell 用于资料、临时文件及环境维护。
                按回执简短报告结果、必要问题与入口；一般讨论无需工具。能力缺口说明后交用户决定，不绕过限制。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates: [AGENTS.md]
              localInstructionFileCandidates: [AGENTS.local.md]

          # ── shell ───────────────────────────────────────────────────────────────────

          # 工作台 CLI 经 shell 调用；注册表与沙箱在 host 平面。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # 草稿读写与仓库检索；注册进 host tools 注册表，不提供服务，无需 realm。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────────

          # 生成等待、dev server 等长命令的后台化；任务注册表在 host 平面。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── compaction ──────────────────────────────────────────────────────────────

          # 长会话上下文压缩；tokenMeter 留在 host 平面。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 素材搜寻与资料核查需要联网；web 服务与搜索 provider 在 host 平面。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # 技能 provider 按会话目录发现；外部项目缺项时按 persona 提供的工具仓库读取。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── StoryCanvas ─────────────────────────────────────────────────────────────

          # 工作台薄工具。注册进 host tools 注册表、不提供服务，无需 realm。模块在本文件
          # 旁边，相对 import 仓库共用客户端（app/scripts/workbench-client.mjs），不复制
          # HTTP 行为。模块插件必须具名导出 inject = ['tools'] 才能访问 ctx.tools。
          # 失败以包含完整 JSON 诊断的异常文本返回，保持 DSH 工具失败状态。
          - id: tool-story-canvas
            name: '@local/dsh-story-canvas-presets/tools'
    - id: preset-story-canvas-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story-canvas-lite
        name: StoryCanvas 极简
        description: 本地模型用；大纲、Prompt、页面管理、文件查找与读图。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你是 StoryCanvas 创作助手，用中文简洁沟通。工具仓库：{{story_canvas_root}}；当前工作区：{{cwd}}。
                先读工具仓库 AGENTS.md，按任务读取 .agents/skills/<名称>/SKILL.md 及其规则；一般讨论无需工具。
                工作台统一用 story_canvas，未知操作或字段查 help，能力以 help/status 为准。文件路径不明先在相关目录 glob；依据回执报告结果和入口。
                只能查文件、读文／读图及使用工作台；生成和训练执行被禁用，不能使用 Shell、联网或任意文件写入。能力缺口交用户决定，不猜接口或绕路。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates: [AGENTS.md]
              localInstructionFileCandidates: [AGENTS.local.md]
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readLimit: 100
              readMaxBytes: 12000
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              globMaxResults: 40
          - id: tool-story-canvas
            name: '@local/dsh-story-canvas-presets/tools'
          - id: lite-tools
            name: '@local/dsh-story-canvas-presets/lite-tools'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.75
                  headroomTokens: 4096
                  retainTokens: 4096
                  maxTokens: 2048
                  modelPolicies:
                    - provider: ollama-local
                      model: huihui-qwen3.8:27b-ud-q4
                      summarizationProvider: deepseek-official
                      summarizationModel: deepseek-flash
                      maxTokens: 4096
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
