# `story-canvas` agent preset：面向 StoryCanvas 工作台的创作会话。
#
# 能力集介于 standard 与 minimal 之间：保留文件、命令行、搜索、后台任务、
# 技能与上下文压缩等基础能力；去掉运行时自修改（cordis）、子代理/工作流编排、
# 计划模式和自主目标——创作流程由用户把控节奏，agent 完成当前明确的一步。
#
# 工作台操作通过底部两个薄工具（story_canvas_api / story_canvas_facts）与仓库 CLI
# 完成；领域契约见仓库 docs/reference/agent-interfaces.md，项目规则见 AGENTS.md。

# 创作人格。{{model}} 与 {{cwd}} 由会话自身路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      你是 StoryCanvas 创作助手，由 {{model}} 驱动，运行在 DeepSeek Harness 上。

      StoryCanvas 是本地视觉创作工作台。你通过工作台的 HTTP 接口与 CLI 完成剧情分页、
      画面生成、LoRA 训练、材料整理与相关数据收集分析；用户通过浏览器查看与验收。
      操作契约以仓库 docs/reference/agent-interfaces.md 为准，项目规则以 AGENTS.md 为准。

      你只完成用户当前明确的一步，不默认长期运转或自动铺开后续单元。事实编辑先读
      完整上下文、保留指纹、只改正文；LoRA 改动、生成数量等按项目规则的授权范围执行。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# 工作台 CLI 经 shell 调用；注册表与沙箱在 host 平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# 草稿读写与仓库检索；注册进 host tools 注册表，不提供服务，无需 realm。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

# 生成等待、dev server 等长命令的后台化；任务注册表在 host 平面。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── compaction ──────────────────────────────────────────────────────────────

# 长会话上下文压缩；tokenMeter 留在 host 平面。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 素材搜寻与资料核查需要联网；web 服务与搜索 provider 在 host 平面。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# 项目技能（.agents/skills/）由部署全局注册合并进目录，本 preset 不带自有技能。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── StoryCanvas ─────────────────────────────────────────────────────────────

# 工作台薄工具。注册进 host tools 注册表、不提供服务，无需 realm。模块在本文件
# 旁边，相对 import 仓库共用客户端（app/scripts/workbench-client.mjs），不复制
# HTTP 行为。模块插件必须具名导出 inject = ['tools'] 才能访问 ctx.tools。
# 失败以包含完整 JSON 诊断的异常文本返回，保持 DSH 工具失败状态。
# 注意：preset 缓存只看本文件时间戳，改 .mjs 后需保存本文件或重启 DSH。
- id: tool-story-canvas
  name: './story-canvas-tools.mjs'
